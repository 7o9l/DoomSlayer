<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=yes">
  <title>DoomSlayer | Cyber Matrix</title>
  <!-- Professional Cyber Fonts (non-default) -->
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Rajdhani:wght@400;500;600;700&family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background-color: #05070f;
      font-family: 'Rajdhani', 'Cairo', sans-serif;
      color: #eef5ff;
      overflow-x: hidden;
    }

    /* Matrix Purple Rain Background */
    #matrix-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      pointer-events: none;
      opacity: 0.2;
    }

    .site-wrapper {
      position: relative;
      z-index: 2;
      max-width: 1300px;
      margin: 0 auto;
      padding: 1.5rem 2rem 4rem;
    }

    /* Language Gate */
    .language-gate {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(5, 7, 15, 0.97);
      backdrop-filter: blur(14px);
      z-index: 200;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      transition: opacity 0.5s ease;
      padding: 1rem;
    }
    .gate-hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }
    .gate-content {
      background: rgba(20, 22, 40, 0.8);
      backdrop-filter: blur(16px);
      border-radius: 2rem;
      padding: 2rem;
      text-align: center;
      border: 1px solid #9b6bff;
      box-shadow: 0 0 35px rgba(155, 107, 255, 0.4);
      width: 90%;
      max-width: 450px;
    }
    .gate-content h2 {
      font-size: 1.8rem;
      font-weight: 700;
      font-family: 'Share Tech Mono', monospace;
      background: linear-gradient(135deg, #9b6bff, #c58aff);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }
    .gate-buttons {
      display: flex;
      gap: 1.2rem;
      justify-content: center;
      margin-top: 1.8rem;
      flex-wrap: wrap;
    }
    .gate-btn {
      background: transparent;
      border: 1.5px solid #9b6bff;
      padding: 0.7rem 1.8rem;
      font-size: 1.2rem;
      font-weight: bold;
      border-radius: 3rem;
      cursor: pointer;
      color: #c58aff;
      font-family: 'Share Tech Mono', monospace;
      transition: 0.3s;
    }
    .gate-btn:hover {
      background: #9b6bff;
      color: #05070f;
      box-shadow: 0 0 20px #b77eff;
    }

    /* Navbar */
    .navbar {
      position: sticky;
      top: 20px;
      z-index: 50;
      background: rgba(8, 10, 20, 0.75);
      backdrop-filter: blur(12px);
      border-radius: 3rem;
      padding: 0.7rem 1.8rem;
      display: flex;
      justify-content: center;
      gap: 2rem;
      flex-wrap: wrap;
      margin-bottom: 2rem;
      border: 1px solid rgba(155, 107, 255, 0.5);
    }
    .navbar a {
      color: #ccd6ff;
      text-decoration: none;
      font-weight: 600;
      font-family: 'Share Tech Mono', monospace;
      font-size: 1rem;
      cursor: pointer;
      transition: 0.2s;
    }
    .navbar a:hover {
      color: #b77eff;
      text-shadow: 0 0 6px #9b6bff;
    }

    /* Profile Card with image1.webp (pulse + neon rotating border) */
    .profile {
      text-align: center;
      background: rgba(12, 15, 28, 0.55);
      backdrop-filter: blur(12px);
      border-radius: 2.5rem;
      padding: 2rem 1.5rem;
      margin-bottom: 2rem;
      border: 1px solid rgba(155, 107, 255, 0.5);
    }
    .profile-avatar-container {
      position: relative;
      width: 130px;
      height: 130px;
      margin: 0 auto 1.2rem;
    }
    .profile-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 50%;
      background: #0a0c18;
      box-shadow: 0 0 15px #9b6bff;
      animation: softPulse 2s infinite ease-in-out;
      position: relative;
      z-index: 2;
    }
    /* rotating neon border */
    .profile-avatar-container::before {
      content: '';
      position: absolute;
      inset: -5px;
      border-radius: 50%;
      padding: 3px;
      background: linear-gradient(135deg, #9b6bff, #38dff7, #9b6bff);
      mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      animation: rotateNeon 3s linear infinite;
      z-index: 1;
    }
    @keyframes rotateNeon {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    @keyframes softPulse {
      0% { transform: scale(1); box-shadow: 0 0 5px #9b6bff; }
      50% { transform: scale(1.02); box-shadow: 0 0 22px #b77eff; }
      100% { transform: scale(1); box-shadow: 0 0 5px #9b6bff; }
    }

    /* Rotating logo image2.png spin moderate speed */
    .rotating-logo {
      width: 70px;
      height: 70px;
      border-radius: 50%;
      object-fit: cover;
      border: 1px solid #9b6bff;
      box-shadow: 0 0 12px #9b6bff;
      animation: spinLogo 8s linear infinite;
      margin: 0 auto 1rem;
    }
    @keyframes spinLogo {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .username {
      font-size: 2.6rem;
      font-weight: 800;
      background: linear-gradient(135deg, #38dff7, #9b6bff);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      font-family: 'Share Tech Mono', monospace;
    }
    .specialties {
      display: flex;
      justify-content: center;
      gap: 1rem;
      flex-wrap: wrap;
      margin: 1rem 0 0.8rem;
    }
    .specialties span {
      background: rgba(155, 107, 255, 0.2);
      padding: 0.3rem 1rem;
      border-radius: 2rem;
      font-size: 0.85rem;
      font-weight: 600;
      font-family: 'Rajdhani', monospace;
      border-left: 2px solid #b77eff;
    }
    .glitch-quote {
      font-size: 1.2rem;
      font-family: 'Share Tech Mono', monospace;
      margin-top: 0.8rem;
      animation: glitchText 1s infinite alternate;
      color: #ddccff;
    }
    @keyframes glitchText {
      0% { text-shadow: -1px 0 #9b6bff, 1px 0 cyan; }
      100% { text-shadow: 1px 0 #b77eff, -1px 0 #38dff7; }
    }

    /* Section Titles */
    .section-title {
      font-size: 2rem;
      margin: 2rem 0 1.2rem;
      background: linear-gradient(135deg, #b77eff, #38dff7);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      border-left: 4px solid #9b6bff;
      padding-left: 1rem;
      font-family: 'Share Tech Mono', monospace;
    }
    body.rtl .section-title {
      border-left: none;
      border-right: 4px solid #9b6bff;
      text-align: right;
      padding-right: 1rem;
    }

    /* Cards with moving neon spark border */
    .project-card, .social-card, .contact-item {
      background: rgba(12, 15, 28, 0.7);
      backdrop-filter: blur(10px);
      border-radius: 1.5rem;
      padding: 1.2rem;
      margin-bottom: 1.2rem;
      border: 1px solid rgba(155, 107, 255, 0.4);
      transition: transform 0.25s, box-shadow 0.3s;
      position: relative;
      overflow: hidden;
    }
    .project-card::after, .social-card::after, .contact-item::after {
      content: '';
      position: absolute;
      top: -2px;
      left: -2px;
      right: -2px;
      bottom: -2px;
      background: linear-gradient(45deg, #9b6bff, #38dff7, #b77eff, #9b6bff);
      background-size: 300% 300%;
      border-radius: inherit;
      z-index: -1;
      opacity: 0;
      transition: opacity 0.4s;
    }
    .project-card:hover::after, .social-card:hover::after, .contact-item:hover::after {
      opacity: 0.7;
      animation: borderSpark 1s linear infinite;
    }
    @keyframes borderSpark {
      0% { background-position: 0% 50%; }
      100% { background-position: 100% 50%; }
    }
    .project-card:hover, .social-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 12px 25px -8px rgba(155, 107, 255, 0.5);
    }

    .project-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
    }
    .project-title {
      font-weight: 700;
      font-size: 1.3rem;
      font-family: 'Share Tech Mono', monospace;
    }
    .project-arrow {
      font-size: 1.5rem;
      transition: transform 0.3s;
    }
    .project-desc {
      overflow: hidden;
      max-height: 0;
      transition: max-height 0.5s ease-out;
    }
    .project-desc.show {
      max-height: 400px;
      padding-top: 0.8rem;
    }
    .github-link {
      display: inline-block;
      margin-top: 0.7rem;
      color: #b77eff;
      text-decoration: none;
      font-weight: 600;
    }

    /* Social Hub - clean icons */
    .social-card a {
      text-decoration: none;
      color: inherit;
    }
    .platform-name {
      font-size: 1.6rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 0.5rem;
    }
    .platform-icon {
      width: 28px;
      height: 28px;
      filter: drop-shadow(0 0 3px #9b6bff);
    }
    .username-small {
      font-size: 1rem;
      margin-left: 2rem;
      margin-top: 0.3rem;
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }
    .external-icon {
      font-size: 0.8rem;
    }

    /* Contact only email */
    .contact-simple {
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
    }
    .contact-item {
      flex: 1;
      min-width: 200px;
      font-weight: 500;
    }

    /* RTL adjustments */
    body.rtl {
      direction: rtl;
      font-family: 'Cairo', 'Rajdhani', sans-serif;
    }
    @media (max-width: 780px) {
      .site-wrapper { padding: 1rem; }
      .username { font-size: 1.8rem; }
      .profile-avatar-container { width: 100px; height: 100px; }
      .navbar { gap: 1rem; }
    }
  </style>
</head>
<body>

<canvas id="matrix-canvas"></canvas>

<!-- LANGUAGE GATE (image2.png appears here once as sliding) -->
<div id="languageGate" class="language-gate">
  <div style="margin-bottom: 1rem;">
    <img id="gateImage2" src="image2.png" alt="image2" style="width: 100px; height: 100px; object-fit: cover; border-radius: 20px; box-shadow: 0 0 20px #9b6bff; animation: slideLeftRight 0.65s ease forwards;">
  </div>
  <div class="gate-content">
    <h2 id="gateQuestionEn">What is your language?</h2>
    <h2 id="gateQuestionAr" style="display:none;">ماهي لغتك؟</h2>
    <div class="gate-buttons">
      <button class="gate-btn" data-lang="en">English</button>
      <button class="gate-btn" data-lang="ar">Arabic</button>
    </div>
  </div>
</div>

<div class="site-wrapper" id="mainSite" style="display: none;">
  <div class="navbar">
    <a data-nav="home">HOME</a>
    <a data-nav="projects">PROJECTS</a>
    <a data-nav="social">SOCIAL</a>
  </div>

  <!-- PROFILE SECTION -->
  <div class="profile">
    <div class="profile-avatar-container">
      <img id="personalImage" class="profile-img" src="image1.webp" alt="DoomSlayer" onerror="this.src='data:image/svg+xml,%3Csvg xmlns=\'http://www.w3.org/2000/svg\' viewBox=\'0 0 100 100\'%3E%3Ccircle cx=\'50\' cy=\'50\' r=\'45\' fill=\'%239b6bff\'/%3E%3Ctext x=\'22\' y=\'65\' fill=\'white\'%3EDS%3C/text%3E%3C/svg%3E'">
    </div>
    <!-- rotating logo image2.png added here (spins) -->
    <img class="rotating-logo" src="image2.png" alt="logo spin" onerror="this.src='data:image/svg+xml,%3Csvg xmlns=\'http://www.w3.org/2000/svg\' viewBox=\'0 0 100 100\'%3E%3Ccircle cx=\'50\' cy=\'50\' r=\'45\' fill=\'%239b6bff\'/%3E%3Ctext x=\'30\' y=\'65\' fill=\'white\'%3Elogo%3C/text%3E%3C/svg%3E'">
    <div class="username">DoomSlayer</div>
    <div class="specialties">
      <span data-i18n="spec1">Embedded Systems</span>
      <span data-i18n="spec2">Web Engineering</span>
      <span data-i18n="spec3">IoT</span>
      <span data-i18n="spec4">Cybersecurity</span>
    </div>
    <div class="glitch-quote" id="quoteText">$ We protect your privacy $</div>
  </div>

  <!-- PROJECTS SECTION with fixed links -->
  <h2 class="section-title" data-i18n="projectsTitle">Projects</h2>
  <div id="projectsContainer"></div>

  <!-- SOCIAL HUB SECTION (fixed: only 7o9l, 78u9_ tiktok + github, no King) -->
  <h2 class="section-title" data-i18n="socialTitle">Social Hub</h2>
  <div id="socialContainer"></div>

  <!-- CONTACT SECTION: Only email -->
  <h2 class="section-title" data-i18n="contactTitle">Contact</h2>
  <div id="contactSection"></div>
</div>

<script>
  // Projects with correct links
  const projectsData = [
    { title_en: "Caesar Cipher Tool", title_ar: "أداة تشفير قيصر", repo: "https://github.com/D0omSlayer/caesar-cipher-tool",
      desc_en: "Advanced encryption tool implementing Caesar cipher with custom shift. Perfect for learning cryptography fundamentals and CTF challenges. Real-time encoding, case preservation, and secure message obfuscation.",
      desc_ar: "أداة تشفير متقدمة تنفذ تشفير قيصر مع إزاحة مخصصة. مثالية لتعلم أساسيات التشفير وتحديات الأمن السيبراني. ترميز فوري والحفاظ على حالة الأحرف وإخفاء آمن للرسائل." },
    { title_en: "Password Security Checker", title_ar: "مدقق أمان كلمات المرور", repo: "https://github.com/D0omSlayer/pass-check",
      desc_en: "Powerful password strength analyzer detecting dictionary attacks, entropy, and common patterns. Provides actionable feedback to harden credentials against brute force.",
      desc_ar: "محلل قوي لقوة كلمات المرور يكتشف هجمات القاموس والأنماط الضعيفة. يقدم توصيات عملية لتقوية الأمان ضد الهجمات." },
    { title_en: "D-Guard Security Scanner", title_ar: "ماسح D-Guard الأمني", repo: "https://github.com/D0omSlayer/D-GuardProject",
      desc_en: "Network vulnerability scanner that identifies open ports, legacy services, and potential backdoors. Designed for ethical hacking, system hardening and generating risk reports.",
      desc_ar: "ماسح ثغرات الشبكة يحدد المنافذ المفتوحة والخدمات القديمة والثغرات الخلفية. صمم للاختراق الأخلاقي وتقوية الأنظمة." },
    { title_en: "Network Monitoring Tool", title_ar: "أداة مراقبة الشبكة", repo: "https://github.com/D0omSlayer/network-test",
      desc_en: "Real-time traffic analyzer with anomaly detection, bandwidth monitoring, and alerts for ARP spoofing or DDoS attempts. Essential for SOC analysts.",
      desc_ar: "محلل حركة مرور فوري مع كشف الحالات الشاذة ومراقبة النطاق الترددي. ينبه إلى انتحال ARP ومحاولات DDoS. أساسي لمحللي الأمن." }
  ];

  // Social data: TikTok (7o9l ,78u9_), GitHub only. No king, no discord/roblox in social hub
  const socialAccounts = [
    { platform: "TikTok", icon: `<svg class="platform-icon" viewBox="0 0 24 24" fill="none" stroke="#9b6bff" stroke-width="1.5"><path d="M9 12V6a4 4 0 0 1 8 0v6m-8 0a4 4 0 0 0 8 0m-8 0a4 4 0 0 1-4-4V6"/><circle cx="12" cy="12" r="9"/></svg>`, accounts: [
        { name: "7o9l", url: "https://www.tiktok.com/@7o9l" },
        { name: "78u9_", url: "https://www.tiktok.com/@78u9_" }
      ] },
    { platform: "GitHub", icon: `<svg class="platform-icon" viewBox="0 0 24 24" fill="none" stroke="#9b6bff"><path d="M9 19c-5 1.5-5-2.5-7-3m14 6v-3.87a3.37 3.37 0 0 0-.94-2.61c3.14-.35 6.44-1.54 6.44-7A5.44 5.44 0 0 0 20 4.77 5.07 5.07 0 0 0 19.91 1S18.73.65 16 2.48a13.38 13.38 0 0 0-7 0C6.27.65 5.09 1 5.09 1A5.07 5.07 0 0 0 5 4.77a5.44 5.44 0 0 0-1.5 3.78c0 5.42 3.3 6.61 6.44 7A3.37 3.37 0 0 0 9 18.13V22"/></svg>`, accounts: [
        { name: "D0omSlayer", url: "https://github.com/D0omSlayer" }
      ] }
  ];

  let currentLang = 'en';
  const translations = {
    projectsTitle: { en: "// PROJECTS //", ar: "// المشاريع //" },
    socialTitle: { en: "// SOCIAL HUB //", ar: "// المركز الاجتماعي //" },
    contactTitle: { en: "// CONTACT //", ar: "// التواصل //" },
    spec1: { en: "Embedded Systems", ar: "أنظمة مدمجة" },
    spec2: { en: "Web Engineering", ar: "هندسة الويب" },
    spec3: { en: "IoT", ar: "إنترنت الأشياء" },
    spec4: { en: "Cybersecurity", ar: "الأمن السيبراني" }
  };

  function updateLanguage() {
    document.body.classList.toggle('rtl', currentLang === 'ar');
    document.documentElement.lang = currentLang === 'ar' ? 'ar' : 'en';
    document.querySelectorAll('[data-i18n]').forEach(el => {
      const key = el.getAttribute('data-i18n');
      if (translations[key] && translations[key][currentLang]) el.innerText = translations[key][currentLang];
    });
    const quote = document.getElementById('quoteText');
    quote.innerText = currentLang === 'en' ? "$ We protect your privacy $" : "$ نحن نحمي خصوصيتك $";
    renderProjects();
    renderSocial();
    renderContact();
  }

  function renderProjects() {
    const container = document.getElementById('projectsContainer');
    container.innerHTML = '';
    projectsData.forEach(proj => {
      const card = document.createElement('div');
      card.className = 'project-card';
      const title = currentLang === 'en' ? proj.title_en : proj.title_ar;
      const desc = currentLang === 'en' ? proj.desc_en : proj.desc_ar;
      card.innerHTML = `
        <div class="project-header">
          <div class="project-title">${escapeHtml(title)}</div>
          <div class="project-arrow">▼</div>
        </div>
        <div class="project-desc">
          <div>${escapeHtml(desc)}</div>
          <a href="${proj.repo}" target="_blank" class="github-link">🔗 GitHub ↗</a>
        </div>
      `;
      const header = card.querySelector('.project-header');
      const descDiv = card.querySelector('.project-desc');
      const arrow = card.querySelector('.project-arrow');
      header.addEventListener('click', () => {
        descDiv.classList.toggle('show');
        arrow.style.transform = descDiv.classList.contains('show') ? 'rotate(180deg)' : 'rotate(0deg)';
      });
      container.appendChild(card);
    });
  }

  function renderSocial() {
    const container = document.getElementById('socialContainer');
    container.innerHTML = '';
    socialAccounts.forEach(soc => {
      const card = document.createElement('div');
      card.className = 'social-card';
      let accountsHtml = '';
      soc.accounts.forEach(acc => {
        accountsHtml += `<div class="username-small"><a href="${acc.url}" target="_blank">${escapeHtml(acc.name)} <span class="external-icon">↗</span></a></div>`;
      });
      card.innerHTML = `<div class="platform-name">${soc.icon} ${escapeHtml(soc.platform)}</div>${accountsHtml}`;
      container.appendChild(card);
    });
  }

  function renderContact() {
    const container = document.getElementById('contactSection');
    container.innerHTML = `<div class="contact-item"><strong>✉️ ProtonMail:</strong> <a href="mailto:7o9l@proton.me" style="color:#b77eff">7o9l@proton.me ↗</a></div>`;
  }

  function escapeHtml(str) { return str.replace(/[&<>]/g, function(m){ return m === '&' ? '&amp;' : (m === '<' ? '&lt;' : '&gt;');}); }

  // Matrix purple effect
  function initMatrix() {
    const canvas = document.getElementById('matrix-canvas');
    const ctx = canvas.getContext('2d');
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    const chars = "01アイウカキクケコフヘホミマナニヌネノ";
    const fontSize = 14;
    const columns = Math.floor(canvas.width / fontSize);
    const drops = Array(columns).fill(1);
    function draw() {
      ctx.fillStyle = "rgba(5, 7, 15, 0.06)";
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = "#9b6bff";
      ctx.font = fontSize + "px monospace";
      for (let i = 0; i < drops.length; i++) {
        const text = chars[Math.floor(Math.random() * chars.length)];
        ctx.fillText(text, i * fontSize, drops[i] * fontSize);
        if (drops[i] * fontSize > canvas.height && Math.random() > 0.97) drops[i] = 0;
        drops[i]++;
      }
      requestAnimationFrame(draw);
    }
    draw();
    window.addEventListener('resize', () => { canvas.width = window.innerWidth; canvas.height = window.innerHeight; });
  }
  initMatrix();

  // Language gate logic
  const gateDiv = document.getElementById('languageGate');
  const mainDiv = document.getElementById('mainSite');
  let animReady = true;
  setTimeout(() => { animReady = true; }, 700);
  document.querySelectorAll('.gate-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      if (!animReady) return;
      currentLang = btn.getAttribute('data-lang');
      gateDiv.classList.add('gate-hidden');
      setTimeout(() => {
        gateDiv.style.display = 'none';
        mainDiv.style.display = 'block';
        updateLanguage();
      }, 500);
    });
  });

  document.querySelectorAll('[data-nav]').forEach(link => {
    link.addEventListener('click', (e) => {
      const target = link.getAttribute('data-nav');
      let el = target === 'projects' ? document.querySelector('[data-i18n="projectsTitle"]') : (target === 'social' ? document.querySelector('[data-i18n="socialTitle"]') : document.querySelector('.profile'));
      if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
    });
  });
</script>
</body>
</html>
