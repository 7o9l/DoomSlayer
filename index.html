<!doctype html>

<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DoomSlayer Identity</title>  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: monospace;
    }

    body {
      background: black;
      color: #00ff88;
      overflow: hidden;
    }

    canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
    }

    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.65);
      z-index: 1;
    }

    .center {
      position: relative;
      z-index: 2;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      text-align: center;
      padding: 20px;
    }

    .card {
      backdrop-filter: blur(10px);
      border: 1px solid #00ff88;
      padding: 20px;
      border-radius: 12px;
      max-width: 600px;
      width: 100%;
    }

    button {
      background: transparent;
      border: 1px solid #00ff88;
      color: #00ff88;
      padding: 10px 20px;
      margin: 10px;
      cursor: pointer;
      transition: 0.3s;
    }

    button:hover {
      background: #00ff88;
      color: black;
    }

    img.avatar {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      border: 2px solid #00ff88;
      margin-bottom: 10px;
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.08); }
      100% { transform: scale(1); }
    }

    .hidden { display: none; }

    a {
      display: block;
      margin: 8px 0;
      color: #00ff88;
      text-decoration: none;
      border: 1px solid #00ff88;
      padding: 8px;
      transition: 0.3s;
    }

    a:hover {
      background: #00ff88;
      color: black;
    }

    .quote {
      margin-top: 10px;
      font-style: italic;
      opacity: 0.8;
    }
  </style></head>
<body><canvas id="matrix"></canvas>

<div class="overlay"></div><div class="center">  <!-- LANGUAGE SELECT -->  <div id="langSelect" class="card">

<p id="about"></p>

  </div></div><script>

let lang = null;

function setLang(l) {
  lang = l;

  document.getElementById('langSelect').classList.add('hidden');
  document.getElementById('main').classList.remove('hidden');

  if (lang === 'ar') {
    document.getElementById('aboutTitle').innerText = 'من أنا';
    document.getElementById('about').innerText =
      'أنا DoomSlayer، مهتم بكل ما يتعلق بالإنترنت، الأمن السيبراني، الأنظمة المدمجة وإنترنت الأشياء وهندسة الويب.';
  } else {
    document.getElementById('aboutTitle').innerText = 'About Me';
    document.getElementById('about').innerText =
      'I am DoomSlayer, interested in everything related to the internet, cybersecurity, embedded systems, IoT and web engineering.';
  }
}

// MATRIX EFFECT
const canvas = document.getElementById('matrix');
const ctx = canvas.getContext('2d');

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

const letters = '01ABCDEFGHIJKLMNOPQRSTUVWXYZ#$%^&*';
const fontSize = 14;
const columns = canvas.width / fontSize;

const drops = Array(Math.floor(columns)).fill(1);

function draw() {
  ctx.fillStyle = 'rgba(0,0,0,0.08)';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  ctx.fillStyle = '#00ff88';
  ctx.font = fontSize + 'px monospace';

  for (let i = 0; i < drops.length; i++) {
    const text = letters[Math.floor(Math.random() * letters.length)];
    ctx.fillText(text, i * fontSize, drops[i] * fontSize);

    if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) {
      drops[i] = 0;
    }
    drops[i]++;
  }
}

setInterval(draw, 33);

</script></body>
</html>
